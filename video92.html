<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>

    <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status" id="loader" style="display: none;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>


    <button class="btn btn-success" data-myattr="get_data">Get Data</button>


    <script>
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        var baseUrl = 'https://fakerestapi.azurewebsites.net';

        function callApi() {
            return new Promise(function (resolve, reject) {

                let xhr = new XMLHttpRequest();
                xhr.open('GET', `${baseUrl}/api/v1/Users`);
                xhr.send();
                xhr.onreadystatechange= function () {
                    if ((this.readyState == 4) && (this.status == 200)) {

                        resolve(this.responseText)
                    }
                    if (this.status != 200) {
                        reject('error')
                    }



                } 

            });

        }

        async function getMyUser() {

            let data=await callApi();
            console.log(JSON.parse(data));

        }

        getMyUser();

    </script>
</body>

</html>
