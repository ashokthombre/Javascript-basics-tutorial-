        function appentToBody(ele) {
            document.body.appendChild(ele);
        }

        function setProperty(selector, property, value) {
            //    console.log(selector,property,value);
            select(selector).style[property] = value;
        }

        function select(selector) {

            return document.querySelector(selector);
        }

        function setAttributeFromObject(element, obj) {
            for (const key in obj) {
                if (!Object.hasOwn(obj, key)) continue;

                element.setAttribute(key, obj[key]);


            }
            return element;
        }

        function createMyElement(ele) {
            return document.createElement(ele);
        }

        function appendMyChild(child, parent) {
            parent.appendChild(child);
        }
