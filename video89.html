<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Document</title>
</head>

<body>

    <div class="container">

        <div class="d-flex justify-content-center">
            <div class="spinner-border" role="status" id="loader" style="display: none;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>


        <form id="myform">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Title</label>
                <input name="title" type="text" name="title" class="form-control" aria-describedby="emailHelp"
                    id="title">
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Due Date</label>
                <input name="duedate" type="date" class="form-control" id="dueDate">
            </div>
            <select name="iscompleted" class="form-select form-select-sm" aria-label="Small select example"
                id="isCompleted">
                <option selected>Open this select menu</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
            <button type="submit" class="btn btn-primary mt-2">Submit</button>
        </form>




        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Title</th>
                    <th scope="col">Completed</th>
                    <th scope="col">DueDate</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>


            </tbody>
        </table>

        <button class="btn btn-success " data-myattr="get-data">Get Data</button>

    </div>


    <script>

        var myObj = {

            url: 'https://fakerestapi.azurewebsites.net',
            type: 'GET'
        }
        function showLoader() {
            document.getElementById('loader').style.display = 'block'
        }
        function hideLoader() {
            document.getElementById('loader').style.display = 'none'
        }
        document.querySelector('button[data-myattr="get-data"]').addEventListener('click', function (e) {
            showLoader();
            var tr = '';
            $.ajax({
                ...myObj,
                url: myObj.url + '/api/v1/Activities',

                success: function (result, status, xhr) {

                    result.forEach((element, index, arr) => {

                        //  console.log(element);
                        tr += ` <tr>
                                    <td>`+ element.id + `</td>
                                    <td>`+ element.title + `</td>
                                    <td>`+ element.completed + `</td>
                                    <td>`+ element.dueDate + `</td>
                                    <td>
                                        <button class="btn btn-success btn-sm view-btn">View</button>
                                        <button class="btn btn-primary btn-sm edit-btn">Edit</button>
                                        <button class="btn btn-danger btn-sm delete-btn">Delete</button>
                                    </td>
                                </tr>`

                        document.querySelector('.table > tbody').innerHTML = tr;


                        hideLoader();

                    });
                },
                error: function (xhr, status, error) {

                }
            })
        });

        document.getElementById('myform').onsubmit = function (e) {
            showLoader();
            e.preventDefault();
            var title = e.target.querySelector('[name="title"]').value;
           // console.log(title);
            var duedate = e.target.querySelector('[name="duedate"]').value;
          //  console.log(duedate);
            var iscompleted = e.target.querySelector('[name="iscompleted"]').value;
         //   console.log(iscompleted);

            var myData = {
                title: title,
                dueDate: duedate,
                completed: Boolean(iscompleted)
            }

            $.ajax({
                ...myObj,
                url: myObj.url + '/api/v1/Activities',
                type: 'POST',
                data: JSON.stringify(myData),
                contentType: 'application/json',
                success: function (result, status, xhr) {

                    Swal.fire({
                        title: "Added!",
                        text: "Record Is Added",
                        icon: "success"
                    });

                    hideLoader();

                },
                error: function () {
                         hideLoader();
                }
            })

        }
    </script>
</body>

</html>
