<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <ul class="list-group">
                        <li class="list-group-item" aria-current="true">An active item</li>
                        <li class="list-group-item">A second item</li>
                        <li class="list-group-item">A third item</li>
                        <li class="list-group-item">A fourth item</li>
                    
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    

    <table class="table">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">User ID</th>
                <th scope="col">Title</th>
                <th scope="col">Completed</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>

          

        </tbody>
    </table>

    <div class="d-flex justify-content-center mySpinner">
        <div class="spinner-grow text-success" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>  
  <div class="text-center">
                <button type=" button" class="btn btn-success myBtn">Success</button>
            </div>
    <script>

        document.querySelector('.myBtn').addEventListener('click', function () {
            //   alert('ok');

            // fetch('https://jsonplaceholder.typicode.com/todos')
            //     .then(response => response.json())
            //     .then(data =>console.log(data))
            //     .catch(Error => console.log("Error found"));

            var tr = '';
            fetch("https://jsonplaceholder.typicode.com/todos")
                .then(function (data) {
                    document.querySelector('.mySpinner').remove();
                    return data.json();
                })
                .then(function (data) {
                    data.forEach((element, index, arr) => {

                        tr = tr + `<tr>
                                            <td scope="row">`+ element.id + `</th>
                                            <td>`+ element.userId + `</td>
                                            <td>`+ element.title + `</td>
                                            <td>`+ element.completed + `</td>
                                            <td>
                                                <button  type="button"  class="btn btn-sm btn-success view-btn" data-bs-toggle="modal"  data-bs-target="#exampleModal" data-id="${element.id}">View</button>
                                                <button class="btn btn-sm btn-primary edit-btn"  data-id="${element.id}">Edit</button>
                                                <button class="btn btn-sm btn-danger delete-btn"  data-id="${element.id}">Delete</button>
                                            </td>
                                        </tr> `



                    });
                    // console.log(tr);
                    document.querySelector('.table > tbody').innerHTML = tr;

                    document.body.addEventListener("click", function (e) {

                        console.log();

                        if (e.target.classList.contains("view-btn")) {
                            const id = e.target.dataset.id;
                            console.log("View clicked for ID:", id);
                           let uid= e.target.closest('tr').querySelector('td:nth-child(1)').innerHTML;
                           let userid= e.target.closest('tr').querySelector('td:nth-child(2)').innerHTML;
                           let title= e.target.closest('tr').querySelector('td:nth-child(3)').innerHTML;
                           let status= e.target.closest('tr').querySelector('td:nth-child(4)').innerHTML;
                          document.querySelector('.modal-body > .list-group >li:first-child ').innerHTML=uid;
                          document.querySelector('.modal-body > .list-group >li:nth-child(2) ').innerHTML=userid;
                          document.querySelector('.modal-body > .list-group >li:nth-child(3) ').innerHTML=title;
                          document.querySelector('.modal-body > .list-group >li:nth-child(4) ').innerHTML=status;
                         
                        }

                        if (e.target.classList.contains("edit-btn")) {
                            const id = e.target.dataset.id;
                            console.log("Edit clicked for ID:", id);
                            // edit logic
                        }

                        if (e.target.classList.contains("delete-btn")) {
                            const id = e.target.dataset.id;
                            console.log("Delete clicked for ID:", id);
                            // delete logic
                            e.target.closest('tr').remove();
                        }

                    });


                })
                .catch(function (error) {

                });

        });





    </script>
</body>

</html>
