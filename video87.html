<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.css"
        integrity="sha512-3pIirOrwegjM6erE5gPSwkUzO+3cTjpnV9lexlNZqvupR64iZBnOOTiiLPb9M36zpMScbmUNIcHUqKD47M719g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"
        integrity="sha512-VEd+nq25CkR676O+pLBnDW09R7VQX9Mdiij052gVCp5yVH3jGtH70Ho/UUv4mJDsEdTvqRCFZg0NKGiojGnUCw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Document</title>
</head>

<body>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group">
                        <li class="list-group-item">An item</li>
                        <li class="list-group-item">A second item</li>
                        <li class="list-group-item">A third item</li>
                        <li class="list-group-item">A fourth item</li>
                        <li class="list-group-item">And a fifth one</li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status" id="loader" style="display: none;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <button class="btn btn-success a_get_user ">Get User</button>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">userName</th>
                <th scope="col">password</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script>

        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        var myobj = {
            url: 'https://fakerestapi.azurewebsites.net',
            type: 'GET'
        }

        document.querySelector('.a_get_user').addEventListener('click', function () {
            // alert('OK');


            showLoader();
            $.ajax({
                ...myobj,
                url: myobj.url + '/api/v1/Users',
                success: function (result, status, xhr) {
                  //  console.log(result);
                    var tr = '';
                    result.forEach((element, index, arr) => {
                        tr = tr + ` <tr>
                                                            <td scope="row">`+ element.id + `</td>
                                                            <td>`+ element.userName + `</td>
                                                            <td>`+ element.password + `</td>
                                                        
                                                            <td>
                                                                    <button class="btn btn-success view-btn btn-sm view-btn" data-id="${element.id}" data-bs-toggle="modal" data-bs-target="#exampleModal">View</button>
                                                                    <button class="btn btn-primary edit-btn btn-sm edit-btn"data-id="${element.id}">Edit</button>
                                                                    <button class="btn btn-danger delete-btn btn-sm delete-btn"data-id="${element.id}">Delete</button>
                                                            </td>
                                                            </tr>`

                    });
                    document.querySelector('.table >tbody').innerHTML = tr;
                },
                error: function (xhr, status, error) {

                },
                complete: function () {
                    hideLoader();
                }
            })
        });

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('view-btn')) {
                let id = e.target.dataset.id;
            //    console.log("View clicked " + id);
            }
            if (e.target.classList.contains('edit-btn')) {
                let id = e.target.dataset.id;
              //  console.log("Edit clicked " + id);
            }
            if (e.target.classList.contains('delete-btn')) {
                let id = e.target.dataset.id;
             //   console.log("Delete clicked " + id);
                $.ajax({
                    ...myobj,
                    url: myobj.url + "/api/v1/Users/" + id,
                    type: 'DELETE',
                    success: function (result, status, xhr) {
                        toastr.success("Deleted Successfully !")
                        e.target.closest('tr').remove();
                    },
                    error: function (xhr, status, error) {

                    },
                    complete: function (xhr, status) {

                    }
                });

            }


        });

    </script>
</body>

</html>
