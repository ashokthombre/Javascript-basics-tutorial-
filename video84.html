<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.24.0/axios.min.js"

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Document</title>
</head>

<body>
    <div class="d-flex justify-content-center" >
        <div class="spinner-border " role="status" style="display: none;"  id="loader">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <button class="btn btn-primary get-data"> Get Data</button>
    <table class="table">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Description</th>
                <th scope="col">Excerpt</th>
                <th scope="col">PageCount</th>
                <th scope="col">PublishDate</th>
                <th scope="col">Action</th>

            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script>

        function showLoader() {
            document.getElementById("loader").style.display = "block";

        }

        function hideLoader() {
            document.getElementById("loader").style.display = "none";
        }

        document.querySelector('.get-data').addEventListener('click', function () {
            showLoader();
            let promiseObject = new Promise(function (resolve, reject) {

                axios.get('https://fakerestapi.azurewebsites.net/api/v1/Books').then(function (response) {

                    resolve(response.data);


                }).catch(function (error) {
                    reject(error);
                });
            });
            var tr = '';
            promiseObject.then(function (data) {
                //  console.log(data);



                data.forEach((element, index, arr) => {
                    //     console.log(element);

                    tr = tr + `<tr>
                                            <td scope="row">`+ element.id + `</th>
                                            <td>`+ element.title + `</td>
                                            <td>`+ element.description + `</td>
                                            <td>`+ element.excerpt + `</td>
                                            <td>`+ element.pageCount + `</td>
                                            <td>`+ element.publishDate + `</td>
                                            <td>
                                                <button  type="button"  class="btn btn-sm btn-success view-btn" data-bs-toggle="modal"  data-bs-target="#exampleModal" data-id="${element.id}">View</button>
                                                <button class="btn btn-sm btn-primary edit-btn"  data-id="${element.id}">Edit</button>
                                                <button class="btn btn-sm btn-danger delete-btn"  data-id="${element.id}">Delete</button>
                                            </td>
                                            
                                        </tr> `

                    //  console.log(tr);
                });
                document.querySelector('.table > tbody').innerHTML = tr;

                hideLoader();

            })
                .catch(function (error) {
                    console.log(error.response);
                });


        });

        //             resolve(response.data);

        //     });


    </script>
</body>

</html>
