    <button onclick="loadData()">Click me</button>

    <script>

        class MyClass {

            getUserInfo(url, callback) {

                var req = new XMLHttpRequest();
                req.open('GET', url);
                req.send()
                req.onload = function () {
                    var response = JSON.parse(req.responseText);
                    //     console.log(response);
                    callback(response);

                }


            }

        }



        var tbody = document.createElement('tbody');
        console.log(tbody);
        document.querySelector('.table').appendChild(tbody);

        function loadData() {
            let obj = new MyClass();

        

         

            obj.getUserInfo('https://jsonplaceholder.typicode.com/users', function (response) {

                //console.log(response);
                response.forEach(element => {
                    //       console.log(element);
             
                    createTable(element);

                });
            });
        }

        function createTable(element) {
            console.log('ID ' + element.id);
            console.log('Name ' + element.name);

            console.log('Email ' + element.email);

            console.log('Website ' + element.website);
            console.log('City ' + element.address.city);
            console.log('Street ' + element.address.street);
            console.log('Suite ' + element.address.suite);
            console.log('Zipcode ' + element.address.zipcode);
            console.log('Lat ' + element.address.geo.lat);
            console.log('Lng ' + element.address.geo.lng);
            console.log('Company Name ' + element.company.name);
            console.log('CatchPhrase ' + element.company.catchPhrase);
            console.log('BS ' + element.company.bs);
            console.log('-------------------------------------------------------------------')

            var tr = document.createElement('tr');
            console.log(tr);
            tbody.appendChild(tr);

            var td = document.createElement('td');
            td.innerHTML = element.id;
            tr.appendChild(td);

            var td1 = document.createElement('td');
